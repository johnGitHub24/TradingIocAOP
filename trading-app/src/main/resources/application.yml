spring:
  application:
    name: trading-ioc-aop
  datasource:
    url: jdbc:h2:mem:tradingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# IntelliJ／bootRun 啟動後 Console 印常用 URL（見 StartupInfoLogger）
startup:
  info:
    enabled: true
    project-name: TradingIocAOP
    frontend: static          # none | static | vite（本專案同埠靜態 Demo）
    auth: false
    h2: true
    api-docs: true
    probe: true
    home-path: /
    extra-paths:
      - /api/v1/orders
      - /api/v1/pricing/AAPL
      - /api/v1/aspects/report

springdoc:
  swagger-ui:
    path: /swagger-ui.html
